name: 매일 자동 갱신

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force_master:
        description: "단지 목록·기본정보도 다시 받기 (1 또는 비워두기)"
        required: false
        default: ""
  push:
    paths:
      - "data/seed.json"
      - "templates/**"
      - "scripts/**"
      - "apps/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: 데이터 수집
        if: github.event_name != 'push'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FORCE_BASS: ${{ github.event.inputs.force_master }}
        run: python scripts/daily_update.py
      - name: 경기지표 수집 (KOSIS·ECOS)
        if: github.event_name != 'push'
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/collect_biz.py || true
      - name: 수집한 데이터 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
      # 데이터·템플릿·스크립트가 그대로면 지난번에 만든 사이트를 재사용 (앱만 고쳤을 때 빠르게 배포)
      - name: 사이트 캐시
        id: sitecache
        uses: actions/cache@v4
        with:
          path: docs
          key: site-${{ hashFiles('data/**', 'templates/**', 'scripts/**') }}
      - name: 사이트 만들기
        if: steps.sitecache.outputs.cache-hit != 'true'
        run: python scripts/build_site.py
      - name: 내 일정 앱 넣기
        run: |
          mkdir -p docs/schedule
          cp -r apps/schedule/. docs/schedule/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 업로드 반영 대기
        run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@v4
